[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowd-control"
version = "0.0.3"
description = "Learnings retention system for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Daniel" },
]
keywords = ["claude", "mcp", "learnings", "context", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Pytest",
]

dependencies = [
    "click",
    "lancedb==0.29.2",
    "mcp[cli]",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/daniel/crowd-control"
Issues = "https://github.com/daniel/crowd-control/issues"

[project.optional-dependencies]
ollama = ["ollama"]
voyage = ["voyageai"]
openai = ["openai"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
crowd-control = "crowd_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_control"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
