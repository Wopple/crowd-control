[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crowd-control"
version = "0.0.9"
description = "Learnings retention system for Claude Code"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Daniel" },
]
keywords = ["claude", "mcp", "learnings", "context", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Framework :: Pytest",
]

dependencies = [
    "click",
    "lancedb==0.29.2",
    # lancedb 0.29.2 imports `CreateEmptyTableRequest` from lance-namespace, which was
    # renamed to `CreateTableRequest` in lance-namespace 0.7.0, so the import crashes on
    # startup. lancedb only declares `lance-namespace>=0.3.2` (no upper bound), so a fresh
    # `uv tool install` resolves the latest and breaks. Pin below 0.7 until lancedb is bumped.
    "lance-namespace<0.7",
    "mcp[cli]",
    "pydantic",
]

[project.urls]
Homepage = "https://github.com/daniel/crowd-control"
Issues = "https://github.com/daniel/crowd-control/issues"

[project.optional-dependencies]
# OllamaLLM requires `format=<schema>` constrained decoding, added in
# ollama-python 0.4.0. An older client silently drops the `format` arg and
# the LLM produces free-form text, which then fails JSON parsing.
ollama = ["ollama>=0.4.0"]
voyage = ["voyageai"]
openai = ["openai"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
crowd-control = "crowd_control.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/crowd_control"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
